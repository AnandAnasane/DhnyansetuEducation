<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Animated Logo</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Remove default spacing */
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        /* Full screen container */
        .logo-container {
            width: 100%;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background-color: #ffffff;
            overflow: hidden;
        }

        /* Logo */
        .animated-logo {
            width: 420px;
            height: auto;

            /* Zoom animation */
            animation: logoZoom 2.5s ease-in-out infinite;

            /* Prevent blurry rendering where possible */
            transform-origin: center center;
        }

        /* Zoom In / Zoom Out Animation */
        @keyframes logoZoom {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }

            100% {
                transform: scale(1);
            }

        }

        /* Mobile responsive logo */
        @media (max-width: 576px) {
            .animated-logo {
                width: 160px;
            }
        }
    </style>
</head>

<body>

    <!-- Center Logo -->
    <div class="logo-container">

        <!-- CHANGE ONLY THIS FILE NAME -->
        <img src="./Education logo.jpeg" alt="Logo" class="animated-logo">

    </div>


    <!-- Bootstrap 5 JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <script>
        // JavaScript can be used here for additional functionality.
        // The zoom animation is handled by CSS.

        document.addEventListener("DOMContentLoaded", function () {

            const logo = document.querySelector(".animated-logo");

            // Make sure the logo is loaded
            logo.addEventListener("load", function () {
                console.log("Logo loaded successfully.");
            });

            // Handle missing logo
            logo.addEventListener("error", function () {
                console.error("Logo file could not be loaded.");
            });

        });
    </script>

</body>

</html>
