<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Website Under Progress</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Full Page */
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        /* Main Container */
        .logo-container {
            width: 100%;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background-color: #ffffff;

            overflow: hidden;
        }

        /* Content */
        .logo-content {
            text-align: center;
        }

        /* Logo */
        .animated-logo {
            width: 220px;
            height: auto;

            animation: logoZoom 2.5s ease-in-out infinite;

            transform-origin: center center;
        }

        /* Logo Zoom Animation */
        @keyframes logoZoom {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }

            100% {
                transform: scale(1);
            }

        }

        /* Website Under Progress Message */
        .progress-message {
            margin-top: 30px;

            font-size: 22px;
            font-weight: 600;

            color: #333333;

            animation: messageFade 2s ease-in-out infinite;
        }

        /* Message Animation */
        @keyframes messageFade {

            0% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.5;
            }

        }

        /* Small Description */
        .progress-description {
            margin-top: 8px;

            font-size: 15px;
            color: #777777;
        }

        /* Loading Dots */
        .loading-dots {
            margin-top: 15px;
        }

        .loading-dots span {
            display: inline-block;

            width: 8px;
            height: 8px;

            margin: 0 4px;

            background-color: #333333;

            border-radius: 50%;

            animation: dots 1.4s infinite ease-in-out both;
        }

        .loading-dots span:nth-child(1) {
            animation-delay: -0.32s;
        }

        .loading-dots span:nth-child(2) {
            animation-delay: -0.16s;
        }

        .loading-dots span:nth-child(3) {
            animation-delay: 0s;
        }

        @keyframes dots {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }

        }

        /* Mobile */
        @media (max-width: 576px) {

            .animated-logo {
                width: 160px;
            }

            .progress-message {
                font-size: 19px;
            }

            .progress-description {
                font-size: 14px;
            }

        }
    </style>

</head>

<body>

    <!-- Main Page -->
    <div class="logo-container">

        <div class="logo-content">

            <!-- ================================= -->
            <!-- CHANGE YOUR LOGO FILE NAME HERE -->
            <!-- ================================= -->

            <img src="./Education logo.jpeg" alt="Website Logo" class="animated-logo">


            <!-- ================================= -->
            <!-- WEBSITE UNDER PROGRESS MESSAGE -->
            <!-- ================================= -->

            <div class="progress-message">
                Website Under Progress
            </div>

            <div class="progress-description">
                We are working hard to bring you something amazing.
            </div>


            <!-- Loading Animation -->
            <div class="loading-dots">

                <span></span>
                <span></span>
                <span></span>

            </div>

        </div>

    </div>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- JavaScript -->
    <script>

        document.addEventListener("DOMContentLoaded", function () {

            const logo = document.querySelector(".animated-logo");

            logo.addEventListener("load", function () {
                console.log("Logo loaded successfully.");
            });

            logo.addEventListener("error", function () {
                console.error("Logo file could not be loaded.");
            });

        });

    </script>

</body>

</html>
